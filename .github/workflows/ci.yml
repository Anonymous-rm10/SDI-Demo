name: checks
on: [push, pull_request]
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tests/smoke_http.py
      - run: node --check voice_agent/web/app.js
      - run: node --check voice_agent/web/capture-worklet.js
      - run: bash -n scripts/start.sh scripts/start_jev.sh
      - run: python scripts/check_repository.py
